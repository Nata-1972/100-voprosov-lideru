services:
  - type: web
    name: 100-voprosov-lideru
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: python -m compileall -q server.py
    startCommand: python server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: FACILITATOR_BOT_TOKEN
        sync: false
      - key: LEADER_EMAIL
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
